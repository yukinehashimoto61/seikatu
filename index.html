<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --serenity:#91A8D0; --accent:#7590C2; --deep:#4C6598; --soft:#DCE4F1;
  --paper:#EFF2F8; --card:#FFFFFF; --border:#DFE5F0;
  --ink:#2E3648; --ink2:#5B6580; --muted:#9AA3B8;
  --rose:#F7CAC9; --rose-deep:#C2807E; --rose-soft:#F7E2E1;
  --urgent:#C4736E; --amber:#B9924F;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;font-size:15px;line-height:1.6}
.num{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-variant-numeric:tabular-nums}
#root{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper)}
.screen{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 28px}

.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hd h1{font-size:18px;font-weight:700;letter-spacing:.12em;margin:0}
.hd .date{margin-left:auto;font-size:13px;color:var(--muted);letter-spacing:.06em}
.hd .gear{border:0;background:transparent;color:var(--muted);font-size:17px;cursor:pointer;padding:2px 0 2px 6px}
.hd button.tapdate{border:0;background:transparent;color:var(--deep);font:inherit;font-size:13px;
  letter-spacing:.06em;cursor:pointer;padding:2px 0;text-decoration:underline dotted;text-underline-offset:4px}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--muted);font-weight:500;margin:0 0 8px}
.eyebrow.mt{margin-top:20px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.flat{padding:0;overflow:hidden}

.rail{position:relative;padding-left:34px;margin:6px 0 22px}
.rail:before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:var(--soft);border-radius:2px}
.rail.rest:before{background:var(--rose-soft)}
.stn{position:relative;display:flex;align-items:center;gap:10px;min-height:46px}
.stn .dot{position:absolute;left:-34px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;
  background:var(--paper);border:2px solid var(--soft);display:flex;align-items:center;justify-content:center}
.stn .dot i{width:8px;height:8px;border-radius:50%;background:transparent;display:block}
.stn.past .dot{border-color:var(--serenity)} .stn.past .dot i{background:var(--serenity)}
.rest .stn.past .dot{border-color:var(--rose-deep)} .rest .stn.past .dot i{background:var(--rose-deep)}
.stn.now .dot{border-color:var(--accent);box-shadow:0 0 0 6px rgba(145,168,208,.22)}
.stn.now .dot i{background:var(--accent);animation:pulse 2.4s ease-in-out infinite}
.rest .stn.now .dot{border-color:var(--rose-deep);box-shadow:0 0 0 6px rgba(247,202,201,.5)}
.rest .stn.now .dot i{background:var(--rose-deep)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}
.stn .nm{font-weight:700;letter-spacing:.14em;font-size:15px;color:var(--muted)}
.stn.past .nm,.stn.now .nm{color:var(--ink)}
.stn .tm{margin-left:auto;font-size:12px;color:var(--muted)}
.stn .go{margin-left:auto;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:13px;
  letter-spacing:.1em;padding:8px 16px;border-radius:999px;cursor:pointer;box-shadow:0 2px 8px rgba(117,144,194,.35)}
.rest .stn .go{background:var(--rose-deep);box-shadow:0 2px 8px rgba(194,128,126,.3)}
.stn .go.ghost,.rest .stn .go.ghost{background:#fff;border:1.5px solid var(--serenity);
  color:var(--deep);font-weight:700;box-shadow:none}
@media (prefers-reduced-motion:reduce){.stn.now .dot i{animation:none}}

.notice{background:#FBF1EF;border:1px solid #EFD7D3;color:#8E5B57;border-radius:12px;
  padding:10px 13px;font-size:12.5px;margin-bottom:14px}

.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .body{min-width:0;flex:1}
.row .nm{font-weight:500;overflow-wrap:anywhere}
.row .sub{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.tick{flex:0 0 auto;border:1.5px solid var(--accent);color:var(--deep);background:transparent;font:inherit;
  font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer}
.tick:active{background:var(--accent);color:#fff}
.done .nm{color:var(--muted);text-decoration:line-through}
.done .tick{border-color:var(--border);color:var(--muted)}

.tag{display:inline-block;font-size:10.5px;letter-spacing:.1em;padding:2px 7px;border-radius:5px;
  background:#EEF2F8;color:var(--ink2);margin-right:5px}
.tag.chore{background:#E6EDF7;color:var(--deep)}
.tag.action{background:#EAE8F4;color:#5E5788}
.tag.task{background:#F7E9E8;color:#96605E}
.tag.q1{background:#F6DDDB;color:var(--urgent)}
.tag.q2{background:#DFE7F5;color:var(--deep)}
.tag.q3{background:#F4EBDB;color:var(--amber)}
.tag.q4{background:#EFF1F5;color:var(--muted)}
.tag.last{background:var(--urgent);color:#fff;font-weight:700}
.tag.over{background:#8E4B47;color:#fff;font-weight:700}

label.f{display:block;font-size:12px;letter-spacing:.1em;color:var(--ink2);font-weight:500;margin:14px 0 6px}
label.f:first-child{margin-top:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--border);
  border-radius:11px;background:#FAFBFE;color:var(--ink);appearance:none}
textarea{min-height:84px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.range{display:flex;align-items:center;gap:8px}
.range span{color:var(--muted);flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;border:1px solid var(--border);
  background:#FAFBFE;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip.mini{font-size:11.5px;padding:5px 10px}
.btn{width:100%;font:inherit;font-weight:700;letter-spacing:.1em;font-size:15px;padding:13px;border:0;
  border-radius:13px;background:var(--deep);color:#fff;cursor:pointer;margin-top:18px}
.btn.sm{margin-top:10px;padding:11px;font-size:14px}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--ink2);font-weight:500}
.btn:disabled{background:#CBD4E4;color:#fff;cursor:default}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px;line-height:1}

.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px}
.empty b{display:block;color:var(--ink2);font-weight:700;margin-bottom:4px;font-size:14.5px}

.upd{flex:0 0 auto;background:var(--deep);color:#fff;display:flex;align-items:center;gap:10px;
  padding:12px 14px calc(12px + env(safe-area-inset-top)/2);font-size:13.5px;font-weight:700;letter-spacing:.04em}
.upd button{font:inherit;font-size:12.5px;font-weight:700;border:0;border-radius:999px;
  padding:8px 15px;background:#fff;color:var(--deep);cursor:pointer;flex:0 0 auto;margin-left:auto}
.upd button.cl{background:transparent;color:rgba(255,255,255,.8);font-size:18px;padding:2px 4px;margin-left:0}
nav{flex:0 0 auto;background:rgba(255,255,255,.96);border-top:1px solid var(--border);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:transparent;font:inherit;font-size:10px;letter-spacing:.06em;
  font-weight:700;color:var(--muted);padding:11px 2px 13px;cursor:pointer}
nav button.on{color:var(--deep)}
nav button span{display:block;font-size:16px;margin-bottom:3px;line-height:1}

.mask{position:fixed;inset:0;background:rgba(46,54,72,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{font-size:16px;margin:0 0 4px}
.sheet p.lead{font-size:13px;color:var(--muted);margin:0 0 14px}
.two{display:flex;gap:8px}
.two button{flex:1;font:inherit;font-size:12.5px;font-weight:700;padding:8px;border-radius:10px;
  border:1px solid var(--border);background:#FAFBFE;color:var(--ink2);cursor:pointer}
.two button.k{border-color:var(--accent);color:var(--deep);background:#F2F6FC}
hr.s{border:0;border-top:1px solid var(--border);margin:14px 0}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.slotbox{margin-bottom:12px}
.slotttl{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.16em;font-weight:700;
  color:var(--ink2);margin:0 0 6px}
.slotttl em{font-style:normal;color:var(--muted);font-weight:400;letter-spacing:0}
.fixed{background:#F0F5FA;border:1px solid var(--soft);border-radius:13px;padding:12px 14px;
  display:flex;align-items:center;gap:10px;margin-bottom:14px}
.fixed b{font-size:13.5px;letter-spacing:.08em;color:var(--deep)}

.sleep{display:flex;align-items:center;gap:9px;padding:7px 14px}
.sleep .dy{font-size:11px;color:var(--muted);width:52px;flex:0 0 auto}
.sleep .track{flex:1;height:8px;background:#EDF0F6;border-radius:4px;overflow:hidden}
.sleep .fill{height:100%;background:var(--serenity);border-radius:4px}
.sleep .fill.short{background:var(--rose-deep)}
.sleep .hh{font-size:11.5px;width:64px;text-align:right;flex:0 0 auto;color:var(--ink2)}
.big{font-size:30px;font-weight:700;letter-spacing:.02em;color:var(--deep)}
.big small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px}

.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.dots i{width:19px;height:19px;border-radius:6px;background:#EDF0F6;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-style:normal;color:var(--muted)}
.dots i.y{background:var(--serenity);color:#fff}
.dots i.b{background:var(--rose);color:#8E5B59}
.cond{display:inline-block;width:22px;height:22px;border-radius:50%;font-size:12px;line-height:22px;
  text-align:center;font-weight:700;margin-right:8px;flex:0 0 auto}
.c4{background:#DFE7F5;color:var(--deep)} .c3{background:#E4EDE6;color:#5B8168}
.c2{background:#F4EBDB;color:var(--amber)} .c1{background:#F6DDDB;color:var(--urgent)}
.diary{font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0}
.file{display:block;text-align:center;font-weight:700;letter-spacing:.1em;font-size:15px;padding:13px;
  border-radius:13px;border:1px solid var(--border);background:#FAFBFE;color:var(--ink2);cursor:pointer;margin-top:10px}
.file input{display:none}
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;
const VERSION = 'v12 ・ 2026-08-12';

/* ---------- storage ---------- */
let LS=null;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); LS=localStorage; }catch(e){}
const mem={};
const store={
  get(k,d){ try{ const v=LS?LS.getItem(k):mem[k]; return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ const s=JSON.stringify(v); if(LS){ try{LS.setItem(k,s)}catch(e){mem[k]=s} } else mem[k]=s; }
};
function useStored(key,init){
  const [v,setV]=useState(()=>store.get(key,init));
  useEffect(()=>{store.set(key,v)},[v]);
  return [v,setV];
}
const DATA_KEYS=['lm_chores','lm_actions','lm_tasks','lm_events','lm_plans','lm_status',
                 'lm_logs','lm_nights','lm_pendingBed','lm_health','lm_appver'];

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const shift=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d);};
const WD=['日','月','火','水','木','金','土'];
const wdOf=s=>new Date(s+'T00:00:00').getDay();
const nice=s=>{const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;};
const gap=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const clock=iso=>{const d=new Date(iso);return `${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const hhmm=m=>`${Math.floor(m/60)}時間${pad(m%60)}分`;
const uid=()=>Math.random().toString(36).slice(2,9);
/* 週は月曜はじまり */
const mondayOf=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return dstr(d);};
const sundayOf=s=>shift(mondayOf(s),6);
const monthStart=s=>s.slice(0,7)+'-01';
const monthEnd=s=>{const d=new Date(s+'T00:00:00');return dstr(new Date(d.getFullYear(),d.getMonth()+1,0));};

/* ---------- chores ---------- */
function choreNote(c){
  const iv=c.interval||{};
  if(iv.type==='daily') return '毎日';
  if(iv.type==='workday') return '仕事の日のみ';
  if(iv.type==='everyN') return `${iv.n}日に一回`;
  if(iv.type==='weekly') return '週に一回';
  if(iv.type==='monthly') return '月に一回';
  return (iv.days||[]).map(d=>WD[d]).join('・')+'曜';
}
/* null = その日は出さない。group: daily(毎日のこと) / sometimes(ときどきのこと) */
function choreState(c,date,isWork){
  const iv=c.interval||{};
  if(iv.type==='daily') return c.lastDone===date?null:{group:'daily',note:'毎日'};
  if(iv.type==='workday'){
    if(!isWork) return null;
    return c.lastDone===date?null:{group:'daily',note:'仕事の日のみ'};
  }
  if(iv.type==='weekdays'){
    if(!(iv.days||[]).includes(wdOf(date))) return null;
    return c.lastDone===date?null:{group:'daily',note:`${WD[wdOf(date)]}曜日`};
  }
  if(iv.type==='weekly'){
    const s=mondayOf(date),e=sundayOf(date);
    if(c.lastDone&&c.lastDone>=s&&c.lastDone<=e) return null;
    return {group:'sometimes',left:gap(date,e),note:'週に一回（月〜日）'};
  }
  if(iv.type==='monthly'){
    const s=monthStart(date),e=monthEnd(date);
    if(c.lastDone&&c.lastDone>=s&&c.lastDone<=e) return null;
    return {group:'sometimes',left:gap(date,e),note:'月に一回'};
  }
  const n=Math.max(1,+iv.n||1);
  if(c.lastDone===date) return null;
  const base=c.lastDone||c.createdAt||date;
  return {group:'sometimes',left:gap(date,shift(base,n)),note:`${n}日に一回`};
}
const leftTag=l=> l>0?{cls:'',txt:`あと${l}日`} : l===0?{cls:'last',txt:'最終日！'} : {cls:'over',txt:`${-l}日すぎてる`};

const QUAD={
  q1:{n:'いますぐやる',s:'重要 × 緊急'}, q2:{n:'予定に入れる',s:'重要 × 緊急でない'},
  q3:{n:'さっと片づける',s:'重要でない × 緊急'}, q4:{n:'いまはやらない',s:'重要でない × 緊急でない'}
};
const ORDER=['q1','q2','q3','q4'];
const quadOf=(t,date)=>{
  const urgent=t.deadline?gap(date,t.deadline)<=3:false;
  return t.impact?(urgent?'q1':'q2'):(urgent?'q3':'q4');
};
const SLOTKEYS=['morning','mid','evening'];
const slotName=(k,work)=>k==='morning'?'朝':k==='evening'?'夜':(work?'仕事中':'日中');
const TAGS=['職場関連','人と会う','おひとりさまタイム'];
const WHENS=['休日','仕事中','平日朝時間','退勤後'];
const COND=[{v:4,m:'◎',t:'good'},{v:3,m:'○',t:'ふつう'},{v:2,m:'△',t:'いまいち'},{v:1,m:'×',t:'つらい'}];
const TYPE_LABEL={chore:'家事',action:'行動',task:'タスク'};
const evTime=e=> e.timeMode==='time' ? (e.time||'')+(e.endTime?`–${e.endTime}`:'') : '終日';
const evSub=e=>[evTime(e),e.tag,e.when].filter(Boolean).join(' ／ ');

function resolve(key,{chores,actions,tasks}){
  const [type,id]=key.split(':');
  if(type==='chore'){const c=chores.find(x=>x.id===id);return c&&{type,id,name:c.name,note:choreNote(c)};}
  if(type==='action'){const a=actions.find(x=>x.id===id);return a&&{type,id,name:a.name,note:'行動'};}
  const t=tasks.find(x=>x.id===id);
  return t&&{type,id,name:t.name,note:(t.kind==='work'?'仕事':'プライベート')+(t.deadline?` ／ 締切 ${nice(t.deadline)}`:'')};
}
function normalize(p){
  if(!p) return p;
  const s=p.slots||{};
  return {...p,slots:{morning:s.morning||[],mid:s.mid||s.work||s.allday||[],evening:s.evening||[]}};
}

/* ---------- backup ---------- */
function exportAll(){
  const out={app:'seikatsu-kanri',version:4,exportedAt:new Date().toISOString(),data:{}};
  DATA_KEYS.forEach(k=>{out.data[k]=store.get(k,null)});
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`seikatsu-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function importAll(file,done){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      const d=(j&&j.data)||j;
      let n=0;
      DATA_KEYS.forEach(k=>{ if(d[k]!==undefined){ store.set(k,d[k]); n++; } });
      if(!n) throw new Error('empty');
      done(null,n);
    }catch(e){ done('このファイルは読み込めませんでした。書き出したJSONを選んでください。'); }
  };
  r.onerror=()=>done('ファイルを開けませんでした。');
  r.readAsText(file);
}

/* ---------- 更新の検知 ---------- */
const reloadFresh=()=>location.replace(location.pathname+'?v='+Date.now());
function useUpdateCheck(){
  const [found,setFound]=useState(false);
  const [hidden,setHidden]=useState(false);
  useEffect(()=>{
    let stop=false;
    const check=()=>{
      fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'})
        .then(r=>r.text())
        .then(t=>{
          const m=t.match(/const VERSION\s*=\s*'([^']+)'/);
          if(!stop&&m&&m[1]!==VERSION) setFound(true);
        }).catch(()=>{});
    };
    check();
    const id=setInterval(check,1000*60*20);
    const onVis=()=>{ if(document.visibilityState==='visible') check(); };
    document.addEventListener('visibilitychange',onVis);
    return ()=>{stop=true;clearInterval(id);document.removeEventListener('visibilitychange',onVis);};
  },[]);
  return [found&&!hidden,()=>setHidden(true)];
}

/* ---------- app ---------- */
/* v6以前は0時に日付を勝手に進めていた。その書き込みを一度だけ取り消す */
(function fixOldRollover(){
  if(store.get('lm_appver',0)>=8){ return; }
  const st=store.get('lm_status',null);
  if(st&&st.phase==='idle'&&st.date===today()&&new Date().getHours()<5){
    store.set('lm_status',{date:shift(today(),-1),phase:'idle'});
  }
  store.set('lm_appver',8);
})();

function App(){
  const [tab,setTab]=useState('home');
  const [gear,setGear]=useState(false);
  const [hasUpdate,dismissUpdate]=useUpdateCheck();
  const [chores,setChores]=useStored('lm_chores',[]);
  const [actions,setActions]=useStored('lm_actions',[]);
  const [tasks,setTasks]=useStored('lm_tasks',[]);
  const [events,setEvents]=useStored('lm_events',[]);
  const [plans,setPlans]=useStored('lm_plans',{});
  const [status,setStatus]=useStored('lm_status',{date:today(),phase:'idle'});
  const [logs,setLogs]=useStored('lm_logs',{});
  const [nights,setNights]=useStored('lm_nights',[]);
  const [pending,setPending]=useStored('lm_pendingBed',null);
  const [health,setHealth]=useStored('lm_health',{pill:{},bleed:{},visits:[],sick:[]});

  const lib={chores,setChores,actions,setActions,tasks,setTasks,events,setEvents,plans,setPlans};
  const counts={家事:chores.length,行動:actions.length,タスク:tasks.filter(t=>!t.done).length,
    予定:events.length,日記:Object.keys(logs).length,睡眠:nights.length};

  return (<>
    {hasUpdate && <div className="upd">
      <span>新しいバージョンがあります</span>
      <button onClick={reloadFresh}>読み込み直す</button>
      <button className="cl" onClick={dismissUpdate} aria-label="閉じる">×</button>
    </div>}
    {tab==='home'&&<Home {...lib} status={status} setStatus={setStatus} onGear={()=>setGear(true)}
      logs={logs} setLogs={setLogs} nights={nights} setNights={setNights}
      pending={pending} setPending={setPending}/>}
    {tab==='plan'&&<Plan {...lib} day={status.date}/>}
    {tab==='reg'&&<Register {...lib}/>}
    {tab==='look'&&<Look logs={logs} setLogs={setLogs} nights={nights}/>}
    {tab==='body'&&<Body health={health} setHealth={setHealth} day={status.date}/>}
    <nav>
      <button className={tab==='home'?'on':''} onClick={()=>setTab('home')}><span>◉</span>きょう</button>
      <button className={tab==='plan'?'on':''} onClick={()=>setTab('plan')}><span>▤</span>段取り</button>
      <button className={tab==='reg'?'on':''} onClick={()=>setTab('reg')}><span>＋</span>登録</button>
      <button className={tab==='look'?'on':''} onClick={()=>setTab('look')}><span>✎</span>ふりかえり</button>
      <button className={tab==='body'?'on':''} onClick={()=>setTab('body')}><span>✚</span>からだ</button>
    </nav>
    {gear && <Backup counts={counts} onClose={()=>setGear(false)}/>}
  </>);
}

function Backup({counts,onClose}){
  const [msg,setMsg]=useState(null);
  return (<div className="mask"><div className="sheet">
    <h2>データの持ち出し</h2>
    <p className="lead">アプリを新しいものに差し替えるときは、先に書き出しておいてください。</p>
    <div className="card" style={{marginBottom:0}}>
      {Object.entries(counts).map(([k,v])=>(
        <div key={k} style={{display:'flex',fontSize:13,padding:'3px 0'}}>
          <span style={{color:'var(--ink2)'}}>{k}</span>
          <span className="num" style={{marginLeft:'auto',color:'var(--muted)'}}>{v}件</span>
        </div>))}
      <hr className="s"/>
      <div style={{display:'flex',fontSize:12,color:'var(--muted)'}}>
        <span>いま動いているアプリ</span><span className="num" style={{marginLeft:'auto'}}>{VERSION}</span>
      </div>
    </div>
    <button className="btn" onClick={reloadFresh}>最新に更新する</button>
    <p className="hint">GitHubのファイルを差し替えたのに変わらないときに押してください。データは消えません。</p>
    <button className="btn" onClick={exportAll}>ぜんぶ書き出す</button>
    <label className="file">
      ファイルから読み込む
      <input type="file" accept="application/json,.json" onChange={e=>{
        const f=e.target.files&&e.target.files[0]; if(!f) return;
        if(!confirm('いまスマホに入っているデータは、読み込んだ内容で置き換わります。続けますか？')){e.target.value='';return;}
        importAll(f,(err)=>{ if(err){setMsg(err);e.target.value='';} else location.reload(); });
      }}/>
    </label>
    {msg&&<p className="hint" style={{color:'var(--urgent)'}}>{msg}</p>}
    <p className="hint">書き出したファイルはスマホの「ファイル」アプリに保存されます。機種変更のときもこれを持っていけば戻せます。</p>
    <button className="btn sm ghost" onClick={onClose}>とじる</button>
  </div></div>);
}

/* ---------- HOME ---------- */
function Home({chores,setChores,actions,tasks,setTasks,events,plans,setPlans,status,setStatus,
               logs,setLogs,nights,setNights,pending,setPending,onGear}){
  const real=today();
  /* 「ねる」→「おきた」を押すまで日は進まない。カレンダーの日付が変わっても切り替えない */
  const d=status.date;
  const phase=status.phase;
  const carryOver=d!==real;
  const plan=normalize(plans[d]);
  const [carry,setCarry]=useState(null);
  const [bed,setBed]=useState(false);
  const [pickDay,setPickDay]=useState(false);

  const stations = !plan
    ? [{k:'up',n:'おきた',slot:null},{k:'sleep',n:'ねる',slot:null}]
    : plan.work
    ? [{k:'up',n:'おきた',slot:'morning'},{k:'office',n:'職場きた',slot:'mid'},
       {k:'off',n:'しごおわ',slot:'evening'},{k:'sleep',n:'ねる',slot:null}]
    : [{k:'up',n:'おきた',slot:'*'},{k:'sleep',n:'ねる',slot:null}];
  const keys=['idle',...stations.map(s=>s.k)];
  const idx=keys.indexOf(phase);
  const cur=stations.find(s=>s.k===phase);

  const patch=fn=>setPlans(p=>{const np={...p};np[d]=normalize({...np[d]});fn(np[d]);return np;});
  const left=slot=>((plan&&plan.slots[slot])||[]).filter(k=>!plan.done[k]&&!plan.dropped[k]);

  const wake=()=>{
    if(pending){
      const wa=new Date().toISOString();
      const min=Math.max(0,Math.round((new Date(wa)-new Date(pending))/60000));
      setNights(ns=>[...ns.filter(x=>x.date!==real),{id:uid(),date:real,bedAt:pending,wakeAt:wa,min}]);
      setPending(null);
    }
    setStatus({date:real,phase:'up'});
  };
  const goTo=k=>{
    if(k==='up'){ wake(); return; }
    if(k==='sleep'){ setBed(true); return; }
    const isNext=keys[idx+1]===k;
    const rest=isNext&&cur&&cur.slot&&cur.slot!=='*'?left(cur.slot):[];
    if(rest.length&&cur.slot!=='evening'){ setCarry({from:cur.slot,keys:rest,next:k}); return; }
    setStatus({date:d,phase:k});
  };
  const sleepNow=(diary,cond,logDate)=>{
    const now=new Date().toISOString();
    const key=logDate||d;
    setPending(now);
    setLogs(l=>({...l,[key]:{...(l[key]||{}),diary,cond,bedAt:now}}));
    setStatus({date:key,phase:'sleep'});
    setBed(false);
  };
  const check=key=>{
    const was=plan.done[key];
    patch(p=>{p.done={...p.done,[key]:!was}});
    const [type,id]=key.split(':');
    if(!was){
      if(type==='chore') setChores(cs=>cs.map(c=>c.id===id?{...c,lastDone:d}:c));
      if(type==='task') setTasks(ts=>ts.map(t=>t.id===id?{...t,done:true}:t));
    }else if(type==='task') setTasks(ts=>ts.map(t=>t.id===id?{...t,done:false}:t));
  };

  const showSlots = !plan||phase==='idle'||phase==='sleep' ? [] : plan.work ? [cur.slot] : SLOTKEYS;
  const dayEvents=events.filter(e=>e.date===d);

  return (<div className="screen">
    <Head title="きょう" date={d} onGear={onGear} onDate={()=>setPickDay(true)}/>
    {carryOver && <div className="notice">
      いま画面に出ているのは {nice(d)} ぶんです。日付は {nice(real)} に変わっていますが、
      「ねる」を押すまで進めません。</div>}

    <div className={'rail'+(plan&&!plan.work?' rest':'')}>
      {stations.map(s=>{
        const pos=keys.indexOf(s.k);
        const st = pos<idx?'past':(s.k===phase?'now':'');
        return (<div key={s.k} className={'stn '+st}>
          <span className="dot"><i/></span>
          <span className="nm">{s.n}</span>
          {keys.indexOf(s.k)>idx && <button className={'go'+(keys[idx+1]===s.k?'':' ghost')}
            onClick={()=>goTo(s.k)}>{s.n} →</button>}
          {st==='past' && <span className="tm">済</span>}
        </div>);
      })}
      {phase==='sleep' && <div className="stn">
        <span className="dot"><i/></span>
        <span className="nm" style={{color:'var(--muted)'}}>つぎの朝</span>
        <button className="go ghost" onClick={wake}>おきた →</button>
      </div>}
    </div>

    {dayEvents.length>0 && <>
      <p className="eyebrow">この日の予定（メモ）</p>
      <div className="card flat">{dayEvents.map(e=>(<div className="row" key={e.id}><div className="body">
        <div className="nm">{e.title}</div><div className="sub">{evSub(e)}</div>
      </div></div>))}</div>
    </>}

    {!plan && <div className="card"><div className="empty">
      <b>{nice(d)} の段取りはありません</b>「段取り」タブで組めます。組まなくても、上のボタンで一日を進められます。
    </div></div>}
    {plan && phase==='idle' && <div className="card"><div className="empty">
      <b>「おきた」を押すと始まります</b>押すまで、やることは表示しません。
    </div></div>}
    {phase==='sleep' && <div className="card"><div className="empty">
      <b>おつかれさま</b>{pending?`${clock(pending)} に一日を終えました。`:''}
    </div></div>}

    {showSlots.map(s=>(<div key={s}>
      <p className="eyebrow mt">{slotName(s,plan.work)}にやると決めたこと</p>
      <div className="card flat">
        {(plan.slots[s]||[]).length===0 && <div className="empty"><b>この時間帯は空です</b>ゆっくりどうぞ。</div>}
        {(plan.slots[s]||[]).map(key=>{
          const it=resolve(key,{chores,actions,tasks}); if(!it) return null;
          const dropped=plan.dropped[key],done=plan.done[key];
          return (<div key={key} className={'row'+(done||dropped?' done':'')}>
            <div className="body">
              <div className="nm"><span className={'tag '+it.type}>{TYPE_LABEL[it.type]}</span>{it.name}</div>
              <div className="sub">{dropped?'今日はやめた':it.note}</div>
            </div>
            {!dropped && <button className="tick" onClick={()=>check(key)}>{done?'やった':'やったよ'}</button>}
          </div>);
        })}
      </div>
    </div>))}

    {carry && <CarrySheet carry={carry} chores={chores} actions={actions} tasks={tasks} work={!!(plan&&plan.work)}
      onDone={(toEve,toDrop)=>{
        patch(p=>{
          const slots={...p.slots};
          slots[carry.from]=(slots[carry.from]||[]).filter(k=>!toEve.includes(k));
          slots.evening=[...(slots.evening||[]),...toEve];
          p.slots=slots;
          const dr={...p.dropped}; toDrop.forEach(k=>dr[k]=true); p.dropped=dr;
        });
        setStatus({date:d,phase:carry.next}); setCarry(null);
      }}/>}
    {bed && <DiarySheet date={d} init={logs[d]} pickDate onCancel={()=>setBed(false)} onSave={sleepNow}/>}
    {pickDay && <DaySheet date={d} onCancel={()=>setPickDay(false)}
      onSave={dt=>{setStatus({date:dt,phase:status.phase});setPickDay(false);}}/>}
  </div>);
}

function CarrySheet({carry,chores,actions,tasks,work,onDone}){
  const [pick,setPick]=useState(()=>Object.fromEntries(carry.keys.map(k=>[k,null])));
  const all=v=>setPick(Object.fromEntries(carry.keys.map(k=>[k,v])));
  const ready=carry.keys.every(k=>pick[k]);
  return (<div className="mask"><div className="sheet">
    <h2>{slotName(carry.from,work)}に残っているもの</h2>
    <p className="lead">夜にまわすか、今日はやめるか決めてください。</p>
    <div className="two" style={{marginBottom:12}}>
      <button onClick={()=>all('evening')}>全部 夜にまわす</button>
      <button onClick={()=>all('drop')}>全部 今日はやめる</button>
    </div>
    {carry.keys.map(k=>{
      const it=resolve(k,{chores,actions,tasks}); if(!it) return null;
      return (<div key={k} style={{marginBottom:12}}>
        <div style={{fontWeight:500,marginBottom:6}}>{it.name}</div>
        <div className="two">
          <button className={pick[k]==='evening'?'k':''} onClick={()=>setPick({...pick,[k]:'evening'})}>夜にまわす</button>
          <button className={pick[k]==='drop'?'k':''} onClick={()=>setPick({...pick,[k]:'drop'})}>今日はやめる</button>
        </div>
      </div>);
    })}
    <button className="btn" disabled={!ready} onClick={()=>onDone(
      carry.keys.filter(k=>pick[k]==='evening'), carry.keys.filter(k=>pick[k]==='drop'))}>これで進む</button>
  </div></div>);
}

function DiarySheet({date,init,onCancel,onSave,pickDate}){
  const [diary,setDiary]=useState(init&&init.diary?init.diary:'');
  const [cond,setCond]=useState(init&&init.cond?init.cond:null);
  const [dt,setDt]=useState(date);
  return (<div className="mask"><div className="sheet">
    <h2>{nice(dt)} の一言</h2>
    <p className="lead">一行でいいです。あとで読み返せます。</p>
    {pickDate&&<>
      <label className="f">何日ぶんとして残す？</label>
      <input type="date" value={dt} onChange={e=>setDt(e.target.value)}/>
      <p className="hint">日付をまたいで寝るときは、前の日のままでかまいません。</p>
    </>}
    <label className="f">今日の体調</label>
    <div className="chips">{COND.map(c=>(
      <button key={c.v} className={'chip'+(cond===c.v?' on':'')} onClick={()=>setCond(c.v)}>{c.m} {c.t}</button>))}</div>
    <label className="f">一言日記</label>
    <textarea value={diary} onChange={e=>setDiary(e.target.value)} placeholder="今日どうだった？"/>
    <button className="btn" onClick={()=>onSave(diary,cond,dt)}>{pickDate?'書いて、ねる':'保存する'}</button>
    <button className="btn sm ghost" onClick={onCancel}>やめる</button>
  </div></div>);
}

/* ---------- PLAN ---------- */
function Plan({chores,actions,tasks,events,plans,setPlans,day}){
  const base=day||today();
  const [date,setDate]=useState(shift(base,1));
  const plan=normalize(plans[date]);
  const patch=fn=>setPlans(p=>{const np={...p};np[date]=normalize({...(np[date]||{})});fn(np[date]);return np;});
  const setWork=w=>setPlans(p=>({...p,[date]:{work:w,slots:{morning:[],mid:[],evening:[]},done:{},dropped:{},fixed:false}}));
  const fixed=!!(plan&&plan.fixed);

  const assigned=useMemo(()=>plan?new Set(Object.values(plan.slots).flat()):new Set(),[plan]);
  const groups=useMemo(()=>{
    const daily=[],sometimes=[],acts=[],tsks=[];
    chores.forEach(c=>{
      const st=choreState(c,date,!!(plan&&plan.work)); if(!st) return;
      const item={key:'chore:'+c.id,name:c.name,note:st.note,type:'chore',left:st.left};
      (st.group==='daily'?daily:sometimes).push(item);
    });
    sometimes.sort((a,b)=>a.left-b.left);
    actions.forEach(a=>acts.push({key:'action:'+a.id,name:a.name,note:'行動',type:'action'}));
    tasks.filter(t=>!t.done).sort((a,b)=>ORDER.indexOf(quadOf(a,date))-ORDER.indexOf(quadOf(b,date)))
      .forEach(t=>tsks.push({key:'task:'+t.id,name:t.name,type:'task',q:quadOf(t,date),
        note:(t.kind==='work'?'仕事':'プライベート')+(t.deadline?` ／ 締切 ${nice(t.deadline)}`:'')}));
    const f=a=>a.filter(x=>!assigned.has(x.key));
    return {daily:f(daily),sometimes:f(sometimes),acts:f(acts),tsks:f(tsks)};
  },[chores,actions,tasks,date,assigned,plan]);

  const move=(key,slot)=>patch(p=>{
    const slots={}; SLOTKEYS.forEach(s=>slots[s]=(p.slots[s]||[]).filter(k=>k!==key));
    if(slot) slots[slot]=[...slots[slot],key];
    p.slots=slots;
  });

  const dayEvents=events.filter(e=>e.date===date);
  const total=plan?Object.values(plan.slots).flat().length:0;
  const nothing=chores.length===0&&actions.length===0&&tasks.filter(t=>!t.done).length===0;

  const Pool=({title,items})=> items.length===0?null:(<div className="slotbox">
    <p className="slotttl">{title} <em>{items.length}件</em></p>
    <div className="card flat">
      {items.map(it=>{
        const lt=it.left!==undefined&&it.left!==null?leftTag(it.left):null;
        return (<div className="row" key={it.key}><div className="body">
          <div className="nm">
            {lt&&<span className={'tag '+lt.cls}>{lt.txt}</span>}
            {it.q&&<span className={'tag '+it.q}>{QUAD[it.q].n}</span>}
            {it.name}
          </div>
          <div className="sub">{it.note}</div>
          <div className="chips" style={{marginTop:6}}>
            {SLOTKEYS.map(s=>(<button key={s} className="chip mini" onClick={()=>move(it.key,s)}>{slotName(s,plan.work)}へ</button>))}
          </div>
        </div></div>);
      })}
    </div>
  </div>);

  return (<div className="screen">
    <Head title="段取り" date={date}/>
    <div className="chips" style={{marginBottom:14}}>
      {[0,1,2].map(n=>{const s=shift(base,n);return(
        <button key={n} className={'chip'+(date===s?' on':'')} onClick={()=>setDate(s)}>
          {n===0?'今日':n===1?'明日':nice(s)}</button>);})}
    </div>

    <p className="eyebrow">この日の予定</p>
    <div className="card flat">
      {dayEvents.length===0 && <div className="empty" style={{padding:'16px 10px'}}>予定なし</div>}
      {dayEvents.map(e=>(<div className="row" key={e.id}><div className="body">
        <div className="nm">{e.title}</div><div className="sub">{evSub(e)}</div>
      </div></div>))}
    </div>

    {!plan && <div className="card">
      <p className="eyebrow">{nice(date)} は</p>
      <div className="chips">
        <button className="chip" onClick={()=>setWork(true)}>仕事</button>
        <button className="chip" onClick={()=>setWork(false)}>休み</button>
      </div>
      <p className="hint">どちらでも 朝／真ん中／夜 の3枠に振り分けます。仕事の日は真ん中が「仕事中」、休みの日は「日中」になります。</p>
    </div>}

    {plan && fixed && <div className="fixed">
      <b>この日の段取りは決定ずみ</b>
      <button className="chip mini" style={{marginLeft:'auto'}}
        onClick={()=>patch(p=>{p.fixed=false})}>編集する</button>
    </div>}

    {plan && !fixed && <>
      <p className="eyebrow mt">入れていないもの</p>
      {nothing && <div className="card"><div className="empty">
        <b>まだ何も登録されていません</b>「登録」タブで家事・行動・タスクを入れてください。</div></div>}
      {!nothing && groups.daily.length+groups.sometimes.length+groups.acts.length+groups.tsks.length===0 &&
        <div className="card"><div className="empty">全部どこかに入りました。</div></div>}
      <Pool title="毎日のこと" items={groups.daily}/>
      <Pool title="ときどきのこと" items={groups.sometimes}/>
      <Pool title="行動" items={groups.acts}/>
      <Pool title="タスク" items={groups.tsks}/>

      <div className="card" style={{display:'flex',alignItems:'center',gap:10,marginTop:16}}>
        <span style={{fontWeight:700,letterSpacing:'.1em'}}>{plan.work?'仕事の日':'休みの日'}</span>
        <button className="chip mini" style={{marginLeft:'auto'}} onClick={()=>{
          if(confirm('この日の振り分けを消してやり直しますか？')) setPlans(p=>{const np={...p};delete np[date];return np;});
        }}>組み直す</button>
      </div>
    </>}

    {plan && SLOTKEYS.map(s=>(<div className="slotbox" key={s}>
      <p className="slotttl">{slotName(s,plan.work)} <em>{(plan.slots[s]||[]).length}件</em></p>
      <div className="card flat">
        {(plan.slots[s]||[]).length===0 && <div className="empty" style={{padding:'16px 10px'}}>
          {fixed?'なし':'上から選んで入れる'}</div>}
        {(plan.slots[s]||[]).map(key=>{
          const it=resolve(key,{chores,actions,tasks}); if(!it) return null;
          return (<div className="row" key={key}>
            <div className="body">
              <div className="nm"><span className={'tag '+it.type}>{TYPE_LABEL[it.type]}</span>{it.name}</div>
              <div className="sub">{it.note}</div>
              {!fixed && <div className="chips" style={{marginTop:6}}>
                {SLOTKEYS.filter(o=>o!==s).map(o=>(
                  <button key={o} className="chip mini" onClick={()=>move(key,o)}>{slotName(o,plan.work)}へ</button>))}
              </div>}
            </div>
            {!fixed && <button className="x" onClick={()=>move(key,null)}>×</button>}
          </div>);
        })}
      </div>
    </div>))}

    {plan && !fixed && <button className="btn" disabled={total===0}
      onClick={()=>patch(p=>{p.fixed=true})}>これで決定</button>}
  </div>);
}

/* ---------- REGISTER ---------- */
function Register(props){
  const [t,setT]=useState('chore');
  return (<div className="screen">
    <Head title="登録"/>
    <div className="chips" style={{marginBottom:14}}>
      {[['chore','家事'],['action','行動'],['task','タスク'],['event','予定']].map(([k,l])=>(
        <button key={k} className={'chip'+(t===k?' on':'')} onClick={()=>setT(k)}>{l}</button>))}
    </div>
    {t==='chore'&&<ChoreForm {...props}/>}
    {t==='action'&&<ActionForm {...props}/>}
    {t==='task'&&<TaskForm {...props}/>}
    {t==='event'&&<EventForm {...props}/>}
  </div>);
}

function ChoreForm({chores,setChores}){
  const [name,setName]=useState(''),[type,setType]=useState(null),[n,setN]=useState(''),[days,setDays]=useState([]);
  const nNum=parseInt(n,10);
  const nBad=type==='everyN'&&!(nNum>=2);

/* ---------- BODY ---------- */
function cycleInfo(cyc,d){
  if(!cyc||!cyc.start) return null;
  const len=Math.max(7,+cyc.length||28), pl=Math.max(0,+cyc.placebo||0);
  const idx=Math.floor(gap(cyc.start,d)/len);
  const sheetStart=shift(cyc.start,idx*len);
  const dayInSheet=gap(sheetStart,d)+1;
  const placeboStart=shift(sheetStart,len-pl);
  /* 出血は偽薬2〜3日目にはじまることが多い */
  const windows=[-1,0,1,2,3].map(i=>{
    const ps=shift(placeboStart,i*len);
    return {ps,from:shift(ps,1),to:shift(ps,2)};
  });
  /* 見込みの終わりが今日より前のものは、もう過ぎた予測なので出さない */
  let ni=windows.findIndex(w=>w.to>=d);
  if(ni<0) ni=windows.length-1;
  return {len,pl,dayInSheet,sheetNo:idx+1,isPlacebo:dayInSheet>len-pl,
    sheetStart,placeboStart,placeboEnd:shift(placeboStart,pl-1),
    nextStart:shift(sheetStart,len),
    next:windows[ni],after:windows.slice(ni+1,ni+3)};
}

  return (<div className="mask"><div className="sheet">
    <h2>いまは何日ぶん？</h2>
    <p className="lead">日付が変わったあとに使いはじめたときなど、ずれていたらここで直せます。</p>
    <input type="date" value={dt} onChange={e=>setDt(e.target.value)}/>
    <button className="btn" onClick={()=>onSave(dt)}>この日ぶんにする</button>
    <button className="btn sm ghost" onClick={onCancel}>やめる</button>
  </div></div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
